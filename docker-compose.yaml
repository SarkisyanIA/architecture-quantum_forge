services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
#    После запуска ollama pull llama3.2
#    command: >
#      sh -c "ollama serve &
#      sleep 5 &&
#      ollama pull llama3.2 &&
#      wait"

volumes:
  ollama_data: